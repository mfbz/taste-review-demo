name: Taste review

# Comments only: every run spends credits, so nothing starts without someone asking.
on:
  issue_comment:
    types: [created]

permissions:
  checks: write
  contents: read
  deployments: read
  issues: write
  pull-requests: write

concurrency:
  group: taste-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/taste review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: mfbz/taste-review@v1
        with:
          taste-api-key: ${{ secrets.TASTE_API_KEY }}
          reference-url: https://taste-review-demo.vercel.app
          paths: /pricing
